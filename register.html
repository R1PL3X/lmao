<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng ký - CanteenGo</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <section class="auth-brand-pane">
    <div style="position:absolute;left:58px;top:50px;right:58px;display:flex;justify-content:space-between;align-items:center;z-index:2;"><div class="auth-brand-mark"><span class="seal">CG</span> CANTEENGO</div><a class="btn btn-gold" href="demo.html">Xem demo giao diện</a></div>
    <div class="auth-brand-copy"><div class="eyebrow">Bắt đầu hành trình đặt món</div><h1>Tham gia<br/>CanteenGo.</h1><p>Tạo tài khoản để xem thực đơn, đặt món, thanh toán QR mô phỏng và theo dõi trạng thái đơn.</p></div>
  </section>
  <section class="auth-form-pane">
  <div class="auth-card">
    <div class="auth-kicker">CanteenGo</div><h1>Tạo tài khoản</h1>
    <p class="subtitle">Đăng ký để bắt đầu đặt món tại CanteenGo</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="field">
        <label>Họ tên</label>
        <input type="text" id="hoTen" required placeholder="Nguyễn Văn A" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="ban@uongbigo.vn" />
      </div>
      <div class="field">
        <label>Mật khẩu (tối thiểu 6 ký tự)</label>
        <input type="password" id="matKhau" required minlength="6" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Vai trò</label>
        <select id="vaiTro">
          <option value="ROLE_BUYER">Sinh viên / Nhân viên (Người mua)</option>
          <option value="ROLE_STAFF">Nhân viên Canteen (KDS)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Đăng ký</button>
    </form>

    <p style="text-align:center; margin: 16px 0 0; font-size:13px;">
      Đã có tài khoản? <a href="index.html" style="color:var(--clr-primary-dark); font-weight:600;">Đăng nhập</a>
    </p>
  </div>
  </section>
</div>

<script src="js/api.js"></script>
<script>
  const alertBox = document.getElementById("alertBox");
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    alertBox.innerHTML = "";
    try {
      const payload = {
        hoTen: document.getElementById("hoTen").value.trim(),
        email: document.getElementById("email").value.trim(),
        matKhau: document.getElementById("matKhau").value,
        vaiTro: document.getElementById("vaiTro").value,
      };
      await apiFetch("/auth/register", { method: "POST", body: JSON.stringify(payload) });
      alertBox.innerHTML = '<div class="alert alert-success">Đăng ký thành công! Đang chuyển đến trang đăng nhập...</div>';
      setTimeout(() => (goTo("index.html")), 1200);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      btn.disabled = false;
    }
  });
</script>
</body>
  <script>
    // Bắt sự kiện khi người dùng bấm nút Submit (Đăng ký)
    document.querySelector('form').addEventListener('submit', async function(event) {
        event.preventDefault(); // Ngăn trình duyệt tải lại trang

        // 1. Lấy giá trị từ các ô nhập liệu trên giao diện
        const fullName = document.getElementById('fullname').value; 
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        // Xóa thông báo lỗi cũ trên màn hình (nếu có)
        const errorBox = document.querySelector('.error-message'); // Thay bằng class chứa thông báo "May chu tra ve loi" của bạn
        if(errorBox) errorBox.style.display = 'none';

        // 2. Gói dữ liệu để gửi đi
        const requestData = {
            fullName: fullName,
            email: email,
            password: password,
            role: role
        };

        try {
            // 3. Gọi API của backend
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestData)
            });

            const data = await response.json();

            // Xử lý lỗi 400 hoặc các lỗi khác từ server
            if (!response.ok) {
                if(errorBox) {
                    errorBox.textContent = data.error || 'Dữ liệu không hợp lệ.';
                    errorBox.style.display = 'block';
                    errorBox.style.color = 'red';
                } else {
                    alert(`Lỗi đăng ký: ${data.error || 'Dữ liệu không hợp lệ'}`);
                }
                return;
            }

            // Nếu đăng ký thành công
            alert('Đăng ký thành công!');
            window.location.href = '/login.html'; // Chuyển sang trang đăng nhập

        } catch (error) {
            console.error("Lỗi kết nối mạng:", error);
            alert("Lỗi mạng, không thể kết nối tới máy chủ.");
        }
    });
</script>
</html>
